<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Second Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/responsive.css" />

  <style>
    /* ===== LOGIN PAGE SPECIFIC ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      background: var(--bg);
      transition: background 0.4s ease;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Background decorative elements */
    body::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatBg 20s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 50%;
      height: 70%;
      background: radial-gradient(circle, rgba(7, 19, 38, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: floatBg 25s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatBg {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.05); }
    }

    /* ===== LOGIN CARD ===== */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 32px;
      padding: 2.8rem 2.2rem 2.5rem;
      border: 1px solid var(--border);
      box-shadow: 0 30px 60px rgba(7, 19, 38, 0.08), 0 10px 30px rgba(7, 19, 38, 0.04);
      transition: box-shadow 0.4s, border-color 0.4s, background 0.4s;
      position: relative;
      overflow: hidden;
    }

    /* Subtle top accent line */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--sky), var(--deep-blue), var(--sky));
      background-size: 200% 100%;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Logo area */
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--deep-blue), var(--navy));
      color: var(--white);
      font-size: 1.8rem;
      font-weight: 700;
      font-family: var(--font-heading);
      margin-bottom: 0.8rem;
      box-shadow: 0 8px 24px rgba(7, 19, 38, 0.15);
      transition: transform 0.3s ease;
    }

    .login-brand .logo-icon:hover {
      transform: scale(1.04);
    }

    .login-brand .logo-icon span {
      color: var(--sky);
    }

    .login-brand h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.2rem;
      font-family: var(--font-heading);
      background: none;
      -webkit-text-fill-color: var(--text);
    }

    .login-brand p {
      font-size: 0.9rem;
      opacity: 0.5;
      font-weight: 400;
    }

    /* Form */
    .login-form {
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.5;
      margin-bottom: 0.4rem;
      transition: opacity 0.3s;
    }

    .form-group .input-wrap {
      position: relative;
    }

    .form-group .input-wrap i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text);
      opacity: 0.25;
      font-size: 1rem;
      transition: opacity 0.3s, color 0.3s;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 3rem;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    .form-group input:focus + i,
    .form-group input:focus ~ i {
      opacity: 0.8;
      color: var(--sky);
    }

    .form-group input::placeholder {
      opacity: 0.35;
      font-weight: 400;
    }

    /* Submit button */
    .login-btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--sky), #2ea8e0);
      color: #071326;
      font-weight: 600;
      font-size: 1rem;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .login-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .login-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.4);
    }

    .login-btn:hover::after {
      opacity: 1;
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    .login-btn i {
      font-size: 1rem;
      transition: transform 0.3s;
    }

    .login-btn:hover i {
      transform: translateX(4px);
    }

    /* Message */
    .form-message {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }

    .form-message.error {
      display: block;
      background: rgba(255, 82, 82, 0.08);
      border: 1px solid rgba(255, 82, 82, 0.2);
      color: #ff5252;
    }

    .form-message.success {
      display: block;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--sky);
    }

    /* Footer link */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      opacity: 0.4;
      letter-spacing: 0.03em;
    }

    .login-footer a {
      color: var(--sky);
      opacity: 0.6;
      transition: opacity 0.3s;
      text-decoration: none;
    }

    .login-footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem 1.8rem;
        border-radius: 24px;
      }

      .login-brand .logo-icon {
        width: 52px;
        height: 52px;
        font-size: 1.4rem;
      }

      .login-brand h1 {
        font-size: 1.3rem;
      }

      .form-group input {
        padding: 0.75rem 1rem 0.75rem 2.6rem;
        font-size: 0.9rem;
      }

      .login-btn {
        padding: 0.8rem;
        font-size: 0.9rem;
      }

      body {
        padding: 1rem;
      }
    }

    @media (max-width: 360px) {
      .login-card {
        padding: 1.5rem 1.2rem 1.5rem;
      }
    }

    /* ===== THEME-AWARE TWEAKS ===== */
    body[data-theme="night"] .login-card {
      background: rgba(10, 37, 64, 0.75);
      border-color: rgba(56, 189, 248, 0.12);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    body[data-theme="night"] .login-brand h1 {
      -webkit-text-fill-color: var(--text);
    }

    body[data-theme="night"] .login-btn {
      background: linear-gradient(135deg, var(--sky), #1a8abf);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
    }

    body[data-theme="night"] .login-btn:hover {
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.35);
    }

    body[data-theme="night"] body::before {
      background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
    }

    body[data-theme="night"] body::after {
      background: radial-gradient(circle, rgba(56, 189, 248, 0.03) 0%, transparent 70%);
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <!-- Brand -->
    <div class="login-brand">
      <div class="logo-icon">S<span>O</span></div>
      <h1>Second Office</h1>
      <p>Admin Access</p>
    </div>

    <!-- Form -->
    <form class="login-form" id="adminLogin">
      <div class="form-group">
        <label for="adminEmail">Email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="adminEmail" placeholder="admin@secondoffice.co.ls" required autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPassword" placeholder="Enter your password" required />
        </div>
      </div>

      <button type="submit" class="login-btn">
        <span>Sign In</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <div id="loginMessage" class="form-message"></div>
    </form>

    <div class="login-footer">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Return to website</a>
    </div>
  </div>
</div>

<script>
  (function() {
    // Theme awareness — the login page uses the same theme system
    const savedTheme = localStorage.getItem('so-theme') || 'day';
    document.body.setAttribute('data-theme', savedTheme);

    // Handle login
    const loginForm = document.getElementById('adminLogin');
    const msg = document.getElementById('loginMessage');

    if (loginForm) {
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();

        if (!email || !password) {
          msg.className = 'form-message error';
          msg.textContent = 'Please enter both email and password.';
          return;
        }

        // In production, use Supabase Auth or your backend
        // For now, simple check (replace with real auth)
        if (email === 'secondoffice@gmail.com' && password === 'password123') {
          localStorage.setItem('admin_logged_in', 'true');
          msg.className = 'form-message success';
          msg.textContent = 'Login successful! Redirecting...';
          setTimeout(function() {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          msg.className = 'form-message error';
          msg.textContent = 'Invalid credentials. Please try again.';
        }
      });
    }

    // Enter key support
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const submitBtn = document.querySelector('.login-btn');
        if (submitBtn && document.activeElement?.closest('.login-form')) {
          submitBtn.click();
        }
      }
    });
  })();
</script>

</body>
</html>
